name: Refresh hosted project index

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/generate-index.js
      - name: Commit generated index
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: Refresh hosted project index
          file_pattern: index.html
      - name: Notify Feishu
        if: always()
        env:
          FEISHU_BOT_WEBHOOK: ${{ secrets.FEISHU_BOT_WEBHOOK }}
          FEISHU_MESSAGE: >-
            GitHub Pages Action finished
            Repository: ${{ github.repository }}
            Branch: ${{ github.ref_name }}
            Status: ${{ job.status }}
            Actor: ${{ github.actor }}
            Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          if [ -z "${FEISHU_BOT_WEBHOOK}" ]; then
            echo "FEISHU_BOT_WEBHOOK secret is not configured; skipping Feishu notification."
            exit 0
          fi
          curl -fsS -X POST "${FEISHU_BOT_WEBHOOK}" \
            -H "Content-Type: application/json" \
            -d "$(node -e 'console.log(JSON.stringify({msg_type:"text",content:{text:process.env.FEISHU_MESSAGE}}))')"
