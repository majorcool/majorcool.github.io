<section id="practice" class="section">
  <div class="section-heading">
    <p class="eyebrow">Prescription</p>
    <h2>把原则变成今天能练的计划</h2>
    <p>选择目标和训练天数，得到一个可执行的周模板。实际训练应根据技术质量、恢复和疼痛反馈调整。</p>
  </div>
  <div class="planner">
    <label>训练目标
      <select id="goalSelect">
        <option value="health">健康基础</option>
        <option value="hypertrophy">增肌</option>
        <option value="strength">最大力量</option>
      </select>
    </label>
    <label>每周天数
      <input id="dayRange" type="range" min="2" max="5" value="3">
      <span id="dayValue">3 天</span>
    </label>
    <div id="planOutput" class="plan-output"></div>
  </div>
</section>
